<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hashmeen ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-hearts"></div>

<div class="sparkles"></div>

<!-- LOADING -->

<div id="loader">

<div class="heart-loader">❤</div>

<p>Preparing your surprise...</p>

</div>

<!-- NOTIFICATION -->

<section id="notification">

<div class="phone">

<div class="top">

<span>💖 New Message</span>

</div>

<div class="notification-card">

<h2>Tanveer Singh</h2>

<p>sent you something special...</p>

<button id="openBtn">

Open ❤️

</button>

</div>

</div>

</section>

<!-- HERO -->

<section id="hero" class="hidden">

<div class="hero-content">

<h1>

Hi Hashmeen 💗

</h1>

<p>

Before you continue...

I just wanted to say...

Thank you for existing.

</p>

<button id="startJourney">

Open My Heart 💌

</button>

</div>

</section>

<!-- PHOTO SECTION -->

<section id="gallery" class="hidden">

<h2>My Favorite Person ❤️</h2>

<div class="photo-container">

<img src="images/photo1.jpg" class="photo">

<img src="images/photo2.jpg" class="photo">

<img src="images/photo3.jpg" class="photo">

<img src="images/photo4.jpg" class="photo">

<img src="images/photo5.jpg" class="photo">

<img src="images/photo6.jpg" class="photo">

</div>

<button id="nextToLetter">

Read My Letter 💕

</button>

</section>

<!-- LETTER -->

<section id="letter" class="hidden">

<div class="letter-box">

<h2>

For My Hashmeen 💖

</h2>

<p id="typingText"></p>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
